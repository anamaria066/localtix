<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">
            <div class="lt-card p-4 p-md-5">
                <h1 class="fw-bold lt-gradient-text text-center mb-1">Create your account</h1>
                <p class="lt-muted text-center mb-4">Join LocalTix and get tickets for local events.</p>

                <div th:if="${!errors.isEmpty()}" class="alert alert-danger" role="alert">
                    Please correct the errors below.
                </div>

                <!-- novalidate: all checks are done on the server, so every field gets our own message -->
                <form th:action="@{/register}" method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="lastName" class="form-label">Last name</label>
                            <input type="text" id="lastName" name="lastName" class="form-control"
                                   th:classappend="${errors.containsKey('lastName')} ? 'is-invalid'"
                                   th:value="${form.lastName}" autofocus>
                            <div class="invalid-feedback" th:text="${errors['lastName']}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" id="firstName" name="firstName" class="form-control"
                                   th:classappend="${errors.containsKey('firstName')} ? 'is-invalid'"
                                   th:value="${form.firstName}">
                            <div class="invalid-feedback" th:text="${errors['firstName']}"></div>
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   th:classappend="${errors.containsKey('email')} ? 'is-invalid'"
                                   th:value="${form.email}" placeholder="you@example.com">
                            <div class="invalid-feedback" th:text="${errors['email']}"></div>
                        </div>

                        <div class="col-sm-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" id="phone" name="phone" class="form-control"
                                   th:classappend="${errors.containsKey('phone')} ? 'is-invalid'"
                                   th:value="${form.phone}" placeholder="07xxxxxxxx">
                            <div class="invalid-feedback" th:text="${errors['phone']}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="birthDate" class="form-label">Birth date</label>
                            <input type="date" id="birthDate" name="birthDate" class="form-control"
                                   th:classappend="${errors.containsKey('birthDate')} ? 'is-invalid'"
                                   th:value="${form.birthDate}">
                            <div class="invalid-feedback" th:text="${errors['birthDate']}"></div>
                        </div>

                        <div class="col-sm-6">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   th:classappend="${errors.containsKey('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:text="${errors['password']}"></div>
                        </div>
                        <div class="col-sm-6">
                            <label for="confirmPassword" class="form-label">Confirm password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                   th:classappend="${errors.containsKey('confirmPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:text="${errors['confirmPassword']}"></div>
                        </div>
                        <div class="col-12">
                            <div class="form-text lt-muted">
                                At least 8 characters, one uppercase letter, one digit and one symbol.
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-lt-primary w-100 py-2 mt-4">Create account</button>
                </form>

                <p class="lt-muted text-center mt-4 mb-0">
                    Already have an account? <a th:href="@{/login}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
