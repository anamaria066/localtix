<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Checkout')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- US-9 AC4: payment page reached from the cart. The card form is added in US-11 (T-11.4). -->
<main class="container py-5">

    <a th:href="@{/cart}" class="btn btn-lt-outline btn-sm mb-4">&larr; Back to cart</a>

    <h1 class="h3 fw-bold lt-gradient-text mb-1">Payment</h1>
    <p class="lt-muted mb-4">Complete your order before the reservation expires.</p>

    <div class="row g-4">

        <!-- Order summary -->
        <div class="col-lg-7">
            <div class="lt-card lt-filter-card p-4">
                <h2 class="h5 mb-3">Your order</h2>
                <div class="lt-detail" th:each="item : ${items}" th:with="event=${item.seat().event}">
                    <span>
                        <span class="fw-semibold" th:text="${event.title}">Hamlet</span>
                        <span class="d-block small lt-muted"
                              th:text="'Seat ' + ${item.seat().rowLabel} + ${item.seat().seatNumber}
                                       + ' · ' + ${item.category().displayName}">Seat A1 · Student</span>
                    </span>
                    <span th:text="${#numbers.formatDecimal(item.price(), 1, 2) + ' RON'}">70.00 RON</span>
                </div>
                <div class="lt-detail">
                    <span class="fw-semibold">Total</span>
                    <span class="fw-bold lt-final-price"
                          th:text="${#numbers.formatDecimal(total, 1, 2) + ' RON'}">170.00 RON</span>
                </div>
            </div>
        </div>

        <!-- Payment -->
        <div class="col-lg-5">
            <div class="lt-card p-4">
                <div class="text-center mb-3">
                    <div class="small lt-muted">Time left to pay</div>
                    <div id="cart-timer" class="lt-timer"
                         th:attr="data-seconds=${remainingSeconds},data-expired-url=@{/cart}"
                         th:text="${remainingSeconds / 60} + ':' + ${#numbers.formatInteger(remainingSeconds % 60, 2)}">10:00</div>
                </div>
                <h2 class="h5 mb-3">Card payment</h2>
                <div class="alert alert-warning mb-3">
                    Online card payment will be available soon.
                </div>
                <button type="button" class="btn btn-lt-primary w-100" disabled
                        th:text="'Pay ' + ${#numbers.formatDecimal(total, 1, 2)} + ' RON'">Pay 170.00 RON</button>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cart-timer.js}"></script>
</body>
</html>
