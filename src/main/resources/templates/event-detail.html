<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${event.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">

    <a th:href="@{/events}" class="btn btn-lt-outline btn-sm mb-4">&larr; Back to Events</a>

    <div class="row g-4">

        <!-- Key info -->
        <div class="col-lg-4">
            <div class="lt-card p-4 h-100">
                <span class="badge lt-badge mb-3"
                      th:classappend="${event.category.badgeClass}"
                      th:text="${event.category.displayName}">Concert</span>

                <h1 class="h3 fw-bold lt-gradient-text mb-4" th:text="${event.title}">Event Title</h1>

                <div class="lt-detail">
                    <span class="lt-muted">City</span>
                    <span th:text="${event.city}">București</span>
                </div>
                <div class="lt-detail">
                    <span class="lt-muted">Venue</span>
                    <span th:text="${event.location}">Sala Palatului</span>
                </div>
                <div class="lt-detail">
                    <span class="lt-muted">Date &amp; time</span>
                    <span th:text="${#temporals.format(event.dateTime, 'dd MMM yyyy, HH:mm')}">15 Dec 2026, 20:00</span>
                </div>
                <div class="lt-detail">
                    <span class="lt-muted">Starting price</span>
                    <span class="fw-bold"
                          th:text="${#numbers.formatDecimal(event.basePrice, 1, 2) + ' RON'}">150.00 RON</span>
                </div>
                <div class="lt-detail">
                    <span class="lt-muted">Available seats</span>
                    <span th:classappend="${availableSeats == 0 ? 'text-danger' : 'text-success'}"
                          th:text="${availableSeats == 0 ? 'Sold out' : availableSeats}">8</span>
                </div>

                <div class="mt-4">
                    <button class="btn btn-lt-primary w-100"
                            th:disabled="${availableSeats == 0}"
                            th:text="${availableSeats == 0 ? 'Sold Out' : 'Get Tickets'}">
                        Get Tickets
                    </button>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="col-lg-8">
            <div class="lt-card p-4 h-100">
                <h2 class="h5 mb-4">About this event</h2>
                <p class="lt-muted" style="line-height: 1.8;" th:text="${event.description}">
                    Event description goes here.
                </p>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
