<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<!-- Shared layout fragments, used by every page:
     <head th:replace="~{fragments/layout :: head('Page title')}"></head>
     <nav th:replace="~{fragments/layout :: navbar}"></nav>
     <footer th:replace="~{fragments/layout :: footer}"></footer> -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | LocalTix'">LocalTix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar lt-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand lt-brand lt-gradient-text" th:href="@{/}">LocalTix</a>
        <ul class="navbar-nav flex-row gap-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/events}">Events</a>
            </li>
            <!-- Logged in: the session holds "userId" (ProfileController.SESSION_USER_ID) -->
            <li class="nav-item" th:if="${session.userId != null}">
                <a class="nav-link" th:href="@{/cart}">Cart</a>
            </li>
            <li class="nav-item" th:if="${session.userId != null}">
                <a class="nav-link" th:href="@{/profile}">My Profile</a>
            </li>
            <li class="nav-item" th:if="${session.userId != null}">
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </li>
            <li class="nav-item" th:if="${session.userId == null}">
                <a class="nav-link" th:href="@{/login}">Login</a>
            </li>
            <li class="nav-item" th:if="${session.userId == null}">
                <a class="nav-link" th:href="@{/register}">Register</a>
            </li>
        </ul>
    </div>
</nav>

<footer th:fragment="footer" class="lt-footer py-4 mt-5">
    <div class="container text-center small">
        &copy; 2026 LocalTix &middot; Tickets for local events
    </div>
</footer>

</body>
</html>
