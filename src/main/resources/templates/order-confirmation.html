<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order Confirmed')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- US-11 AC4: after a successful payment the order is "Paid" and the seats are "Sold" -->
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="alert alert-success">
                Payment successful! Your tickets are booked.
            </div>

            <div class="lt-card lt-filter-card p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h1 class="h4 fw-bold lt-gradient-text mb-1"
                            th:text="'Order #' + ${order.id}">Order #1</h1>
                        <div class="small lt-muted"
                             th:text="'Placed on ' + ${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">
                            Placed on 19 Nov 2026, 12:00
                        </div>
                    </div>
                    <span class="badge lt-badge-paid" th:text="${order.status == T(ro.ase.localtix.model.OrderStatus).PAID} ? 'Paid' : 'Pending'">Paid</span>
                </div>

                <div class="lt-detail" th:each="seat : ${order.seats}" th:with="event=${seat.event}">
                    <span>
                        <span class="fw-semibold" th:text="${event.title}">Hamlet</span>
                        <span class="d-block small lt-muted"
                              th:text="${#temporals.format(event.dateTime, 'dd MMM yyyy, HH:mm')} + ' · ' + ${event.location}">
                            25 Nov 2026, 18:00 · Teatrul Național
                        </span>
                    </span>
                    <span class="fw-semibold" th:text="'Seat ' + ${seat.rowLabel} + ${seat.seatNumber}">Seat A1</span>
                </div>

                <div class="lt-detail">
                    <span class="fw-semibold">Total paid</span>
                    <span class="fw-bold lt-final-price"
                          th:text="${#numbers.formatDecimal(order.total, 1, 2) + ' RON'}">170.00 RON</span>
                </div>

                <a th:href="@{/events}" class="btn btn-lt-primary w-100 mt-4">Browse more events</a>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
